<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>PrivatePDF - 100% Local PDF & Image Toolkit</title>
    <meta name="description" content="Ultra-fast, privacy-first PDF toolkit running 100% in your browser. Convert images to PDF, merge, split, compress, organize, watermark, rotate, crop, and sign PDFs with zero server uploads." />
    <meta property="og:title" content="PrivatePDF - 100% Local PDF & Image Toolkit" />
    <meta property="og:description" content="Ultra-fast, privacy-first PDF toolkit running 100% in your browser. Convert images to PDF, merge, split, compress, organize, watermark, rotate, crop, and sign PDFs with zero server uploads." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Strict local Content Security Policy: All processing stays in-browser -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none';"
    />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#E5322D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrivatePDF" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Inter & font smoothing -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-red-500 selection:text-white dark:bg-gray-950 dark:text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
